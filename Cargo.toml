[package]
name = "box3d"
version = "0.1.0"
edition = "2021"
authors = ["Brandon Hubbard <bkhubbard@gmail.com>", "Erin Catto (Box3D author)", "box3d-rs contributors"]
license = "MIT"
description = "High-performance pure Rust 3D physics engine for games, forked from Erin Catto's Box3D"
repository = "https://github.com/bhubbard/box3d-rs"
homepage = "https://github.com/bhubbard/box3d-rs"
readme = "README.md"
keywords = ["physics", "3d", "game-dev", "box3d", "simulation"]
categories = ["game-development", "science::robotics", "simulation"]

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
rayon = { version = "1.10", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
colored = { version = "3.0", optional = true }

[features]
default = ["std", "multithreaded"]
std = []
multithreaded = ["dep:rayon"]
serde = ["dep:serde", "dep:serde_json"]
cli = ["dep:clap", "dep:colored"]

[[bin]]
name = "box3d-cli"
path = "src/bin/main.rs"
required-features = ["cli"]

[dev-dependencies]
approx = "0.5"
